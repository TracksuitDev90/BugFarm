<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bug Farm</title>
<meta name="description" content="A cosy picture-book terrarium full of cute critters. Feed them, decorate their tank, change the weather and watch what happens.">
<meta name="theme-color" content="#f6ead0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bug Farm">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="preload" href="assets/fonts/patrick-hand-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/chewy-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="src/ui/style.css">
<style>
  /* inline so the loading card shows instantly, even before the stylesheet arrives */
  html,body{margin:0;height:100%;background:#f6ead0;overflow:hidden}
  #loading{position:fixed;inset:0;display:grid;place-items:center;background:#f6ead0;z-index:50;font-family:'Chewy','Patrick Hand','Comic Sans MS',sans-serif;color:#3a2a1f;transition:opacity .4s}
  #loading .logo{font-size:54px;color:#e2553f;-webkit-text-stroke:2px #3a2a1f;text-shadow:3px 4px 0 rgba(58,42,31,.25);text-align:center;line-height:1}
  #loading .sub{font-family:'Patrick Hand','Comic Sans MS',sans-serif;text-align:center;font-size:18px;margin-top:10px}
  #loading .bar{width:200px;height:12px;border:2.5px solid #3a2a1f;border-radius:8px;margin:12px auto 0;overflow:hidden;background:#fbf3df}
  #loading .bar i{display:block;height:100%;width:8%;background:#77b255;transition:width .2s}
  #loading .bug{display:block;margin:0 auto 10px;width:72px;height:56px}
  noscript{position:fixed;inset:auto 0 20px;text-align:center;font-family:sans-serif}
</style>
</head>
<body>
<div id="app">
  <canvas id="tank" tabindex="0" aria-label="The bug farm tank. Drag to look around, pinch to zoom, tap a critter to meet it."></canvas>
  <div id="loading">
    <div>
      <svg class="bug" viewBox="-30 -24 60 46" aria-hidden="true"><g stroke="#3a2a1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M-6 9 l-3 8 M3 10 l0 8 M11 9 l3 8" fill="none"/><path d="M-20 10 C-21 -16 15 -18 17 10 Z" fill="#e2553f"/><circle cx="-9" cy="-3" r="3.5" fill="#3a2a1f"/><circle cx="3" cy="-9" r="3.5" fill="#3a2a1f"/><circle cx="9" cy="1" r="3" fill="#3a2a1f"/><circle cx="21" cy="5" r="7" fill="#3a2a1f"/><circle cx="23" cy="3" r="2.2" fill="#fff" stroke="none"/><path d="M23 -2 l3 -8 M19 -2 l-1 -9" fill="none"/></g></svg>
      <div class="logo">BUG FARM</div>
      <div class="sub" id="loadmsg">Waking everybody up...</div>
      <div class="bar"><i id="loadbar"></i></div>
    </div>
  </div>
</div>
<noscript>Bug Farm needs JavaScript to run.</noscript>
<script type="module" src="src/main.js"></script>
</body>
</html>
